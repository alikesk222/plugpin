version: "2"
run:
  timeout: 5m
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*os.File).Close
        - (io.Closer).Close
formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - testdata
