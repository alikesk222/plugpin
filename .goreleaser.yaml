# Release config for a future tag. v0.1 does not publish a release.
# No Homebrew tap. If a tap is added later, commit_author must be
# Ali Kesik <alikesk222@users.noreply.github.com>.
version: 2

project_name: plugpin

changelog:
  disable: true

builds:
  - id: plugpin
    main: ./cmd/plugpin
    binary: plugpin
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/alikesk222/plugpin/internal/cli.Version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: archive
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

release:
  mode: keep-existing
