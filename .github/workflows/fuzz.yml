name: fuzz

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Fuzz parsers
        run: |
          go test -fuzz=FuzzParseHEAD -fuzztime=20s ./internal/gitread
          go test -fuzz=FuzzParsePackedRefs -fuzztime=20s ./internal/gitread
          go test -fuzz=FuzzParseHooksDocument -fuzztime=20s ./internal/cfgparse
          go test -fuzz=FuzzParseMCPDocument -fuzztime=20s ./internal/cfgparse
          go test -fuzz=FuzzParseCodexTOML -fuzztime=20s ./internal/cfgparse
